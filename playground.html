<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground | Phee Playground</title>
    <meta
      name="description"
      content="Games, tutorials, and activities to play, learn, and explore."
    />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
        var a = localStorage.getItem("accent");
        if (a) document.documentElement.setAttribute("data-accent", a);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <button class="cornify-button" id="cornify-btn" type="button">
      Cornify this page <span aria-hidden="true">✨</span>
    </button>
    <p
      class="cornify-status"
      id="cornify-status"
      role="status"
      aria-live="polite"
    ></p>
    <header class="site-header">
      <a class="brand" href="index.html">Phee Playground</a>
      <button
        class="nav-toggle"
        id="nav-toggle"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        Menu
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="internet-stuff.html">Internet Stuff</a>
        <a href="n8n.html">n8n</a>
        <a href="playground.html" aria-current="page">Playground</a>
        <button class="theme-toggle" id="theme-toggle" type="button">
          Dark mode
        </button>
        <div class="accent-picker">
          <p class="accent-label" id="accent-label">Accent color</p>
          <div class="swatches" role="group" aria-labelledby="accent-label">
            <button
              class="swatch"
              data-accent="blue"
              aria-label="Blue"
              aria-pressed="true"
            ></button>
            <button
              class="swatch"
              data-accent="coral"
              aria-label="Coral"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-accent="green"
              aria-label="Green"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-accent="violet"
              aria-label="Violet"
              aria-pressed="false"
            ></button>
          </div>
        </div>
      </nav>
    </header>
    <main id="main">
      <section class="hero" id="top">
        <p class="fact-kicker">Play, learn, explore</p>
        <h1>Playground</h1>
        <p class="lede">
          A collection of games, tutorials, and activities you love, with twists
          and turns!
        </p>
      </section>
      <section
        class="section"
        id="playground"
        aria-labelledby="playground-title"
      >
        <h2 id="playground-title">Pick something to play</h2>
        <div id="playground-app">
          <noscript><p>The games need JavaScript turned on.</p></noscript>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <p>&copy; <span id="year">2026</span> Phee Playground</p>
    </footer>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="games/playground.js"></script>
  </body>
</html>
